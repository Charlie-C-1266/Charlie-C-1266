<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 62" width="440" height="62" role="img" aria-labelledby="title"><title id="title">Senior Test Engineer</title><style>
.t{font:500 18px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#22C55E}
.ch{opacity:0;animation:type .01s linear forwards}
@keyframes type{to{opacity:1}}
.hop{animation:hop 12.0s ease-in-out infinite}
@keyframes hop{0%,4%,100%{transform:translateY(0)}2%{transform:translateY(-4px)}}
.cur{fill:#22C55E;animation:curmove 1.40s steps(20) 0.3s forwards,
  blink .5s step-end 1.70s 4,curfade .3s 3.70s forwards}
@keyframes curmove{from{transform:translateX(0)}to{transform:translateX(220.0px)}}
@keyframes blink{50%{opacity:0}}
@keyframes curfade{to{opacity:0}}

.snake{opacity:0;animation:slither 12.0s linear 3.0s infinite}
@keyframes slither{
  0%{opacity:1;transform:translateX(-60.0px)}
  58.125%{opacity:1;transform:translateX(498.0px)}
  58.542%,100%{opacity:0;transform:translateX(498.0px)}}
.tongue{animation:flick 1.1s step-end infinite}
@keyframes flick{0%,55%{opacity:0}56%,72%{opacity:1}73%,100%{opacity:0}}

.led{fill:#22C55E;animation:idle 2.4s ease-in-out infinite}
@keyframes idle{0%,100%{opacity:.35}50%{opacity:.9}}
.burst{fill:#22C55E;opacity:0;animation:burst 12.0s linear 8.09s infinite}
@keyframes burst{0%,2%,4%,6%{opacity:1}1%,3%,5%,7%,100%{opacity:0}}

.tick{opacity:0;transform-box:fill-box;transform-origin:center;animation:tick 12.0s ease-out 8.31s infinite}
@keyframes tick{0%{opacity:0;transform:scale(.4)}3%{opacity:1;transform:scale(1.1)}5%,16%{opacity:1;transform:scale(1)}22%,100%{opacity:0;transform:scale(1)}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  .ch{opacity:1}.snake,.tick,.burst,.cur{opacity:0}
}
